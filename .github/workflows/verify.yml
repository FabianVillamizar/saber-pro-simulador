name: Verificar contenido

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Verificadores de contenido
        run: |
          set -e
          for f in scripts/verificar-*.mjs; do
            echo "::group::$f"
            node "$f"
            echo "::endgroup::"
          done
      - name: Build
        run: npm run build
