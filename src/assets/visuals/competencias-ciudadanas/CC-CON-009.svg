<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400">
  <defs>
    <marker id="flecha-cc" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--cc-accent)" />
    </marker>
  </defs>

  <text x="260" y="26" fill="var(--text)" font-size="16" font-weight="800" text-anchor="middle" font-style="normal">Estado colombiano</text>
  <text x="260" y="44" fill="var(--text-sub)" font-size="12" font-weight="500" text-anchor="middle" font-style="normal">ramas del poder público</text>

  <rect x="20" y="64" width="150" height="74" rx="10" fill="var(--surface-alt)" stroke="var(--text)" stroke-width="2" />
  <text x="95" y="92" fill="var(--text)" font-size="13" font-weight="700" text-anchor="middle" font-style="normal">Rama Ejecutiva</text>
  <text x="95" y="111" fill="var(--text-sub)" font-size="11" font-weight="500" text-anchor="middle" font-style="normal">Presidente,</text>
  <text x="95" y="125" fill="var(--text-sub)" font-size="11" font-weight="500" text-anchor="middle" font-style="normal">ministerios</text>

  <rect x="185" y="64" width="150" height="74" rx="10" fill="var(--surface-alt)" stroke="var(--text)" stroke-width="2" />
  <text x="260" y="92" fill="var(--text)" font-size="13" font-weight="700" text-anchor="middle" font-style="normal">Rama Legislativa</text>
  <text x="260" y="111" fill="var(--text-sub)" font-size="11" font-weight="500" text-anchor="middle" font-style="normal">Senado,</text>
  <text x="260" y="125" fill="var(--text-sub)" font-size="11" font-weight="500" text-anchor="middle" font-style="normal">Cámara</text>

  <rect x="350" y="64" width="150" height="74" rx="10" fill="var(--surface-alt)" stroke="var(--text)" stroke-width="2" />
  <text x="425" y="92" fill="var(--text)" font-size="13" font-weight="700" text-anchor="middle" font-style="normal">Rama Judicial</text>
  <text x="425" y="111" fill="var(--text-sub)" font-size="11" font-weight="500" text-anchor="middle" font-style="normal">Cortes,</text>
  <text x="425" y="125" fill="var(--text-sub)" font-size="11" font-weight="500" text-anchor="middle" font-style="normal">jurisdicciones</text>

  <path d="M260,138 Q212,168 165,138" fill="none" stroke="var(--cc-accent)" stroke-width="1.6" marker-end="url(#flecha-cc)" />
  <text x="212" y="190" fill="var(--cc-accent)" font-size="12" font-weight="600" text-anchor="middle" font-style="normal">cita a ministros</text>
  <text x="212" y="206" fill="var(--text-faint)" font-size="10" font-weight="500" text-anchor="middle" font-style="italic">control político</text>

  <path d="M425,138 Q372,168 320,138" fill="none" stroke="var(--cc-accent)" stroke-width="1.6" marker-end="url(#flecha-cc)" />
  <text x="372" y="190" fill="var(--cc-accent)" font-size="12" font-weight="600" text-anchor="middle" font-style="normal">revisa sus decretos</text>
  <text x="372" y="206" fill="var(--text-faint)" font-size="10" font-weight="500" text-anchor="middle" font-style="italic">de constitucionalidad</text>

  <path d="M95,138 Q70,235 185,220" fill="none" stroke="var(--cc-accent)" stroke-width="1.6" marker-end="url(#flecha-cc)" />
  <text x="115" y="258" fill="var(--cc-accent)" font-size="12" font-weight="600" text-anchor="middle" font-style="normal">puede objetar</text>
  <text x="115" y="274" fill="var(--text-faint)" font-size="10" font-weight="500" text-anchor="middle" font-style="italic">un proyecto de ley</text>

  <line x1="95" y1="138" x2="95" y2="300" stroke="var(--border)" stroke-width="2" stroke-linecap="round" />
  <line x1="260" y1="138" x2="260" y2="300" stroke="var(--border)" stroke-width="2" stroke-linecap="round" />
  <line x1="425" y1="138" x2="425" y2="300" stroke="var(--border)" stroke-width="2" stroke-linecap="round" />
  <line x1="95" y1="300" x2="425" y2="300" stroke="var(--border)" stroke-width="2" stroke-linecap="round" />
  <line x1="260" y1="300" x2="260" y2="320" stroke="var(--border)" stroke-width="2" stroke-linecap="round" />

  <rect x="140" y="320" width="240" height="62" rx="10" fill="none" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="4,4" />
  <text x="260" y="345" fill="var(--text-sub)" font-size="12" font-weight="600" text-anchor="middle" font-style="normal">Órganos autónomos</text>
  <text x="260" y="361" fill="var(--text-sub)" font-size="12" font-weight="600" text-anchor="middle" font-style="normal">e independientes (art. 113)</text>
  <text x="260" y="376" fill="var(--text-faint)" font-size="10" font-weight="500" text-anchor="middle" font-style="normal">Ministerio Público, Contraloría</text>

  <text x="260" y="393" fill="var(--text-faint)" font-size="10.5" font-weight="500" text-anchor="middle" font-style="italic">separación + colaboración armónica + controles recíprocos</text>

</svg>