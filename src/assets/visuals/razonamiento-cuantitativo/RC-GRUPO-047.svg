<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <defs>
    <marker id="flecha" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--text)" />
    </marker>
  </defs>

  <text x="120" y="20" fill="var(--text)" font-size="11" font-weight="700" text-anchor="middle">Tanque superior (elevado)</text>
  
  <ellipse cx="120" cy="40" rx="55" ry="8" fill="none" stroke="var(--accent)" stroke-width="2" />
  <line x1="65" y1="40" x2="65" y2="110" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" />
  <line x1="175" y1="40" x2="175" y2="110" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" />
  <path d="M65,110 A55,8 0 0 0 175,110" fill="none" stroke="var(--accent)" stroke-width="2" />
  

  <line x1="120" y1="110" x2="120" y2="150" stroke="var(--text-sub)" stroke-width="2" stroke-linecap="round" />
  <line x1="120" y1="150" x2="300" y2="150" stroke="var(--text-sub)" stroke-width="2" stroke-linecap="round" />
  <line x1="300" y1="150" x2="300" y2="175" stroke="var(--text-sub)" stroke-width="2" stroke-linecap="round" marker-end="url(#flecha)" />
  <text x="210" y="140" fill="var(--text-sub)" font-size="10" font-weight="500" text-anchor="middle">tubería (desborde)</text>

  <text x="300" y="165" fill="var(--text)" font-size="11" font-weight="700" text-anchor="middle">Tanque inferior</text>
  
  <ellipse cx="300" cy="178" rx="55" ry="8" fill="none" stroke="var(--exito)" stroke-width="2" />
  <line x1="245" y1="178" x2="245" y2="233" stroke="var(--exito)" stroke-width="2" stroke-linecap="round" />
  <line x1="355" y1="178" x2="355" y2="233" stroke="var(--exito)" stroke-width="2" stroke-linecap="round" />
  <path d="M245,233 A55,8 0 0 0 355,233" fill="none" stroke="var(--exito)" stroke-width="2" />
  

  <line x1="30" y1="245" x2="370" y2="245" stroke="var(--text-faint)" stroke-width="2" stroke-linecap="round" />
  <text x="200" y="240" fill="var(--text-faint)" font-size="10" font-weight="500" text-anchor="middle">nivel del suelo</text>
  <text x="200" y="15" fill="var(--text-faint)" font-size="10" font-weight="500" text-anchor="middle">capacidad total = capacidad tanque superior + capacidad tanque inferior</text>

</svg>