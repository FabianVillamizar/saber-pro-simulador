<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 0 424 260">
  <defs>
    <marker id="flecha" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--text)" />
    </marker>
  </defs>

  <text x="200" y="20" fill="var(--text)" font-size="13" font-weight="700" text-anchor="middle">Planta del terreno · 40 m × 25 m</text>
  <rect x="40" y="40" width="320" height="160" rx="4" fill="none" stroke="var(--text)" stroke-width="2" />
  <line x1="40" y1="210" x2="360" y2="210" stroke="var(--text-sub)" stroke-width="2" stroke-linecap="round" />
  <text x="200" y="226" fill="var(--text-sub)" font-size="11" font-weight="500" text-anchor="middle">40 m</text>
  <line x1="24" y1="40" x2="24" y2="200" stroke="var(--text-sub)" stroke-width="2" stroke-linecap="round" />
  <text x="14" y="120" fill="var(--text-sub)" font-size="11" font-weight="500" text-anchor="end">25 m</text>

  <circle cx="320" cy="80" r="22" fill="var(--accent)" stroke="var(--accent)" stroke-width="2" fill-opacity="0.15" />
  <line x1="320" y1="80" x2="342" y2="80" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" />
  <text x="331" y="72" fill="var(--accent)" font-size="10" font-weight="500" text-anchor="middle">r=2 m</text>
  <text x="320" y="118" fill="var(--accent)" font-size="10" font-weight="500" text-anchor="middle">tanque cilíndrico</text>
  <text x="320" y="132" fill="var(--accent)" font-size="10" font-weight="500" text-anchor="middle">(altura 3 m)</text>

