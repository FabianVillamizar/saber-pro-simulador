<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220">
  <defs>
    <marker id="flecha" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--text)" />
    </marker>
  </defs>

  <rect x="30" y="30" width="360" height="140" rx="8" fill="none" stroke="var(--text)" stroke-width="2" />
  <rect x="190" y="30" width="40" height="140" rx="8" fill="var(--border)" stroke="var(--border)" stroke-width="2" />
  <text x="110" y="105" fill="var(--text)" font-size="12" font-weight="700" text-anchor="middle">Zona de siembra A</text>
  <text x="210" y="105" fill="var(--text-sub)" font-size="10" font-weight="700" text-anchor="middle">Camino</text>
  <text x="210" y="120" fill="var(--text-sub)" font-size="10" font-weight="500" text-anchor="middle">1 m</text>
  <text x="305" y="105" fill="var(--text)" font-size="12" font-weight="700" text-anchor="middle">Zona de siembra B</text>

  <line x1="30" y1="185" x2="390" y2="185" stroke="var(--text)" stroke-width="2" stroke-linecap="round" marker-end="url(#flecha)" />
  <line x1="390" y1="185" x2="30" y2="185" stroke="var(--text)" stroke-width="2" stroke-linecap="round" marker-end="url(#flecha)" />
  <text x="210" y="200" fill="var(--text-sub)" font-size="11" font-weight="500" text-anchor="middle">15 m (largo)</text>

  <line x1="15" y1="30" x2="15" y2="170" stroke="var(--text)" stroke-width="2" stroke-linecap="round" marker-end="url(#flecha)" />
  <line x1="15" y1="170" x2="15" y2="30" stroke="var(--text)" stroke-width="2" stroke-linecap="round" marker-end="url(#flecha)" />
  <text x="15" y="20" fill="var(--text-sub)" font-size="11" font-weight="500" text-anchor="start">10 m (ancho)</text>

</svg>