<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220">

  <circle cx="200" cy="120" r="90" fill="none" stroke="var(--text)" stroke-width="2" />
  <text x="120" y="45" fill="var(--text)" font-size="16" font-weight="800" text-anchor="middle">A</text>
  <circle cx="200" cy="130" r="35" fill="var(--accent)" stroke="var(--accent)" stroke-width="2" fill-opacity="0.2" />
  <text x="200" y="130" fill="var(--accent)" font-size="14" font-weight="800" text-anchor="middle">B</text>
  <text x="200" y="205" fill="var(--text-faint)" font-size="10" font-weight="500" text-anchor="middle">B está completamente dentro de A (B ⊆ A)</text>

</svg>