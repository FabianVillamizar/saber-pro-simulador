<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 0 480 260">
  <defs>
    <marker id="flecha" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--text)" />
    </marker>
  </defs>

  <text x="150" y="14" fill="var(--text)" font-size="12" font-weight="800" text-anchor="middle">Eje desde 0 (0 a 120)</text>
  <line x1="50" y1="40" x2="50" y2="200" stroke="var(--text)" stroke-width="2" stroke-linecap="round" />
  <line x1="50" y1="200" x2="210" y2="200" stroke="var(--text)" stroke-width="2" stroke-linecap="round" />
  <rect x="60" y="57" width="34" height="143" rx="2" fill="var(--text-sub)" stroke="var(--text-sub)" stroke-width="1" /><text x="77" y="49" fill="var(--text)" font-size="10" font-weight="700" text-anchor="middle">102</text><text x="77" y="222" fill="var(--text-sub)" font-size="10" font-weight="500" text-anchor="middle">Q1</text>
  <rect x="100" y="52.5" width="34" height="147.5" rx="2" fill="var(--text-sub)" stroke="var(--text-sub)" stroke-width="1" /><text x="117" y="44.5" fill="var(--text)" font-size="10" font-weight="700" text-anchor="middle">105</text><text x="117" y="222" fill="var(--text-sub)" font-size="10" font-weight="500" text-anchor="middle">Q2</text>
  <rect x="140" y="48" width="34" height="152" rx="2" fill="var(--accent)" stroke="var(--accent)" stroke-width="1" /><text x="157" y="40" fill="var(--text)" font-size="10" font-weight="700" text-anchor="middle">108</text><text x="157" y="222" fill="var(--text-sub)" font-size="10" font-weight="500" text-anchor="middle">Q3</text>
  <rect x="180" y="42" width="34" height="158" rx="2" fill="var(--accent)" stroke="var(--accent)" stroke-width="1" /><text x="197" y="34" fill="var(--text)" font-size="10" font-weight="700" text-anchor="middle">112</text><text x="197" y="222" fill="var(--text-sub)" font-size="10" font-weight="500" text-anchor="middle">Q4</text>
  <text x="130" y="238" fill="var(--exito)" font-size="10" font-weight="500" text-anchor="middle">las cuatro barras se ven casi iguales</text>

  <text x="320" y="20" fill="var(--text)" font-size="12" font-weight="800" text-anchor="middle">Eje truncado (90 a 120)</text>
  <line x1="250" y1="30" x2="250" y2="200" stroke="var(--text)" stroke-width="2" stroke-linecap="round" />
  <line x1="250" y1="200" x2="410" y2="200" stroke="var(--text)" stroke-width="2" stroke-linecap="round" />
  <text x="240" y="34" fill="var(--text-sub)" font-size="9" font-weight="500" text-anchor="end">120</text>
  <text x="240" y="204" fill="var(--text-sub)" font-size="9" font-weight="500" text-anchor="end">90</text>
  <rect x="260" y="128" width="34" height="72" rx="2" fill="var(--text-sub)" stroke="var(--text-sub)" stroke-width="1" /><text x="277" y="120" fill="var(--text)" font-size="10" font-weight="700" text-anchor="middle">102</text><text x="277" y="222" fill="var(--text-sub)" font-size="10" font-weight="500" text-anchor="middle">Q1</text>
  <rect x="300" y="110" width="34" height="90" rx="2" fill="var(--text-sub)" stroke="var(--text-sub)" stroke-width="1" /><text x="317" y="102" fill="var(--text)" font-size="10" font-weight="700" text-anchor="middle">105</text><text x="317" y="222" fill="var(--text-sub)" font-size="10" font-weight="500" text-anchor="middle">Q2</text>
  <rect x="340" y="92" width="34" height="108" rx="2" fill="var(--accent)" stroke="var(--accent)" stroke-width="1" /><text x="357" y="84" fill="var(--text)" font-size="10" font-weight="700" text-anchor="middle">108</text><text x="357" y="222" fill="var(--text-sub)" font-size="10" font-weight="500" text-anchor="middle">Q3</text>
  <rect x="380" y="68" width="34" height="132" rx="2" fill="var(--accent)" stroke="var(--accent)" stroke-width="1" /><text x="397" y="60" fill="var(--text)" font-size="10" font-weight="700" text-anchor="middle">112</text><text x="397" y="222" fill="var(--text-sub)" font-size="10" font-weight="500" text-anchor="middle">Q4</text>
  <text x="330" y="238" fill="var(--warning)" font-size="10" font-weight="500" text-anchor="middle">Q4 parece casi el doble de Q1</text>

  <text x="210" y="255" fill="var(--text-faint)" font-size="10" font-weight="500" text-anchor="middle">datos idénticos ($102, $105, $108 y $112 millones) — solo cambió dónde empieza el eje</text>

</svg>