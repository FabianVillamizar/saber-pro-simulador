<svg xmlns="http://www.w3.org/2000/svg" viewBox="-44 0 508 240">
  <defs>
    <marker id="flecha" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--text)" />
    </marker>
  </defs>

  <line x1="70" y1="20" x2="70" y2="200" stroke="var(--text)" stroke-width="2" stroke-linecap="round" />
  <text x="30" y="30" fill="var(--accent)" font-size="11" font-weight="500" text-anchor="start">Ventas</text>
  <text x="30" y="44" fill="var(--accent)" font-size="9" font-weight="500" text-anchor="start">(millones $)</text>
  <text x="60" y="204" fill="var(--accent)" font-size="9" font-weight="500" text-anchor="end">0</text>
  <text x="60" y="116" fill="var(--accent)" font-size="9" font-weight="500" text-anchor="end">50</text>
  <text x="60" y="34" fill="var(--accent)" font-size="9" font-weight="500" text-anchor="end">100</text>

  <line x1="350" y1="20" x2="350" y2="200" stroke="var(--text)" stroke-width="2" stroke-linecap="round" />
  <text x="390" y="30" fill="var(--warning)" font-size="11" font-weight="500" text-anchor="end">Satisfacción</text>
  <text x="390" y="44" fill="var(--warning)" font-size="9" font-weight="500" text-anchor="end">(0 a 10 pts)</text>
  <text x="360" y="204" fill="var(--warning)" font-size="9" font-weight="500" text-anchor="start">0</text>
  <text x="360" y="115" fill="var(--warning)" font-size="9" font-weight="500" text-anchor="start">5</text>
  <text x="360" y="25" fill="var(--warning)" font-size="9" font-weight="500" text-anchor="start">10</text>

  <line x1="70" y1="200" x2="350" y2="200" stroke="var(--border)" stroke-width="2" stroke-linecap="round" />
  <text x="70" y="218" fill="var(--text-sub)" font-size="9" font-weight="500" text-anchor="middle">mes 1</text>
  <text x="140" y="218" fill="var(--text-sub)" font-size="9" font-weight="500" text-anchor="middle">mes 2</text>
  <text x="210" y="218" fill="var(--text-sub)" font-size="9" font-weight="500" text-anchor="middle">mes 3</text>
  <text x="280" y="218" fill="var(--text-sub)" font-size="9" font-weight="500" text-anchor="middle">mes 4</text>
  <text x="350" y="218" fill="var(--text-sub)" font-size="9" font-weight="500" text-anchor="middle">mes 5</text>

  <path d="M70,132 L140,106.5 L210,89.5 L280,64 L350,38.5" fill="none" stroke="var(--accent)" stroke-width="2.5" />
  <circle cx="70" cy="132" r="3.5" fill="var(--accent)" />
  <circle cx="140" cy="106.5" r="3.5" fill="var(--accent)" />
  <circle cx="210" cy="89.5" r="3.5" fill="var(--accent)" />
  <circle cx="280" cy="64" r="3.5" fill="var(--accent)" />
  <circle cx="350" cy="38.5" r="3.5" fill="var(--accent)" />
  <path d="M70,115 L140,98 L210,84.4 L280,72.5 L350,55.5" fill="none" stroke="var(--warning)" stroke-width="2.5" />
  <circle cx="70" cy="115" r="3.5" fill="var(--warning)" />
  <circle cx="140" cy="98" r="3.5" fill="var(--warning)" />
  <circle cx="210" cy="84.4" r="3.5" fill="var(--warning)" />
  <circle cx="280" cy="72.5" r="3.5" fill="var(--warning)" />
  <circle cx="350" cy="55.5" r="3.5" fill="var(--warning)" />

  <text x="140" y="60" fill="var(--accent)" font-size="10" font-weight="700" text-anchor="middle">ventas</text>
  <text x="280" y="100" fill="var(--warning)" font-size="10" font-weight="700" text-anchor="middle">satisfacción</text>

  <text x="210" y="236" fill="var(--text-faint)" font-size="10" font-weight="500" text-anchor="middle">cada eje tiene su propia escala independiente — por eso las curvas "coinciden" visualmente</text>

</svg>