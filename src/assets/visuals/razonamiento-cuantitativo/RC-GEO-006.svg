<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220">

  <polygon points="60,150 180,150 180,240 60,240" fill="none" stroke="var(--text)" stroke-width="2" /><polygon points="60,150 90,120 210,120 180,150" fill="none" stroke="var(--text)" stroke-width="2" /><polygon points="180,150 210,120 210,210 180,240" fill="none" stroke="var(--text)" stroke-width="2" />
