<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <defs>
    <marker id="flecha" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--text)" />
    </marker>
  </defs>

  <rect x="20" y="20" width="360" height="200" rx="12" fill="none" stroke="var(--border)" stroke-width="2" />
  <text x="200" y="40" fill="var(--text)" font-size="13" font-weight="700" text-anchor="middle">Club deportivo · 200 miembros</text>

  <circle cx="170" cy="140" r="75" fill="var(--accent)" stroke="var(--accent)" stroke-width="2" fill-opacity="0.12" />
  <circle cx="250" cy="140" r="75" fill="var(--exito)" stroke="var(--exito)" stroke-width="2" fill-opacity="0.12" />

  <text x="135" y="135" fill="var(--accent)" font-size="18" font-weight="800" text-anchor="middle">65</text>
  <text x="135" y="155" fill="var(--accent)" font-size="10" font-weight="500" text-anchor="middle">solo fútbol</text>

  <text x="210" y="135" fill="var(--text)" font-size="18" font-weight="800" text-anchor="middle">25</text>
  <text x="210" y="155" fill="var(--text-sub)" font-size="10" font-weight="500" text-anchor="middle">ambos</text>

  <text x="285" y="135" fill="var(--exito)" font-size="18" font-weight="800" text-anchor="middle">45</text>
  <text x="285" y="155" fill="var(--exito)" font-size="10" font-weight="500" text-anchor="middle">solo básquet</text>

  <text x="200" y="235" fill="var(--text-faint)" font-size="11" font-weight="500" text-anchor="middle">65 no practican ninguno de los dos (fuera de los círculos)</text>

