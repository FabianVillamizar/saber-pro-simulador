<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240">
  <defs>
    <marker id="flecha" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--text)" />
    </marker>
  </defs>

  <rect x="40" y="40" width="320" height="160" rx="8" fill="none" stroke="var(--border)" stroke-width="2" stroke-dasharray="4,4" />
  <rect x="120" y="80" width="160" height="120" rx="8" fill="none" stroke="var(--text)" stroke-width="2" />
  <text x="200" y="145" fill="var(--text)" font-size="12" font-weight="700" text-anchor="middle">Habitación principal</text>

  <line x1="120" y1="65" x2="280" y2="65" stroke="var(--text)" stroke-width="2" stroke-linecap="round" marker-end="url(#flecha)" />
  <line x1="280" y1="65" x2="120" y2="65" stroke="var(--text)" stroke-width="2" stroke-linecap="round" marker-end="url(#flecha)" />
  <text x="200" y="55" fill="var(--accent)" font-size="11" font-weight="500" text-anchor="middle">4 cm</text>

  <line x1="105" y1="80" x2="105" y2="200" stroke="var(--text)" stroke-width="2" stroke-linecap="round" marker-end="url(#flecha)" />
  <line x1="105" y1="200" x2="105" y2="80" stroke="var(--text)" stroke-width="2" stroke-linecap="round" marker-end="url(#flecha)" />
  <text x="90" y="145" fill="var(--accent)" font-size="11" font-weight="500" text-anchor="end">3 cm</text>

  <rect x="50" y="205" width="130" height="26" rx="6" fill="none" stroke="var(--text-sub)" stroke-width="2" />
  <text x="115" y="222" fill="var(--text-sub)" font-size="11" font-weight="500" text-anchor="middle">Escala 1:100  →  1 cm = 1 m</text>

</svg>