<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220">

  <text x="200" y="20" fill="var(--text)" font-size="13" font-weight="700" text-anchor="middle">A ∩ B — intersección</text>
  <circle cx="160" cy="120" r="70" fill="none" stroke="var(--text)" stroke-width="2" />
  <circle cx="240" cy="120" r="70" fill="none" stroke="var(--text)" stroke-width="2" />
  <clipPath id="clipA"><circle cx="160" cy="120" r="70" /></clipPath>
  <circle cx="240" cy="120" r="70" fill="var(--accent)" fill-opacity="0.4" clip-path="url(#clipA)" />
  <text x="120" y="120" fill="var(--text)" font-size="16" font-weight="800" text-anchor="middle">A</text>
  <text x="280" y="120" fill="var(--text)" font-size="16" font-weight="800" text-anchor="middle">B</text>
  <text x="200" y="200" fill="var(--text-faint)" font-size="10" font-weight="500" text-anchor="middle">solo la zona de traslape está sombreada</text>

</svg>