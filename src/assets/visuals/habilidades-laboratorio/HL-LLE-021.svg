<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="hl-flecha" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="var(--text-sub)" />
    </marker>
    <marker id="hl-flecha-ac" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="var(--accent)" />
    </marker>
  </defs>

  <rect x="60" y="12" width="200" height="40" rx="7" fill="none" stroke="var(--text)" stroke-width="1.6" />
  <text x="160" y="28" fill="var(--text)" font-size="10.5" font-weight="700" text-anchor="middle">Fase orgánica (éter)</text>
  <text x="160" y="43" fill="var(--text-sub)" font-size="9" font-weight="500" text-anchor="middle">amina · ácido carboxílico · fenol · neutro</text>
  
    <line x1="150" y1="58" x2="150" y2="78" stroke="var(--text-sub)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#hl-flecha)" />
    <text x="158" y="72" fill="var(--accent)" font-size="10" font-weight="600" text-anchor="start">lavar con HCl diluido</text>
    <rect x="14" y="82" width="150" height="40" rx="6" fill="none" stroke="var(--accent)" stroke-width="1.6" />
    <text x="22" y="98" fill="var(--text)" font-size="10" font-weight="700" text-anchor="start">fase acuosa</text>
    <text x="22" y="113" fill="var(--text-sub)" font-size="9" font-weight="500" text-anchor="start">amina protonada (sal)</text>
    <line x1="166" y1="102" x2="210" y2="102" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#hl-flecha-ac)" />
    <text x="216" y="99" fill="var(--text-sub)" font-size="9" font-weight="500" text-anchor="start">acidificar →</text>
    <text x="216" y="111" fill="var(--accent)" font-size="9.5" font-weight="700" text-anchor="start">amina</text>
  
    <line x1="150" y1="132" x2="150" y2="152" stroke="var(--text-sub)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#hl-flecha)" />
    <text x="158" y="146" fill="var(--accent)" font-size="10" font-weight="600" text-anchor="start">lavar con NaHCO₃ (base débil)</text>
    <rect x="14" y="156" width="150" height="40" rx="6" fill="none" stroke="var(--accent)" stroke-width="1.6" />
    <text x="22" y="172" fill="var(--text)" font-size="10" font-weight="700" text-anchor="start">fase acuosa</text>
    <text x="22" y="187" fill="var(--text-sub)" font-size="9" font-weight="500" text-anchor="start">solo el carboxilato</text>
    <line x1="166" y1="176" x2="210" y2="176" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#hl-flecha-ac)" />
    <text x="216" y="173" fill="var(--text-sub)" font-size="9" font-weight="500" text-anchor="start">acidificar →</text>
    <text x="216" y="185" fill="var(--accent)" font-size="9.5" font-weight="700" text-anchor="start">ácido carboxílico</text>
  
    <line x1="150" y1="206" x2="150" y2="226" stroke="var(--text-sub)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#hl-flecha)" />
    <text x="158" y="220" fill="var(--accent)" font-size="10" font-weight="600" text-anchor="start">lavar con NaOH (base fuerte)</text>
    <rect x="14" y="230" width="150" height="40" rx="6" fill="none" stroke="var(--accent)" stroke-width="1.6" />
    <text x="22" y="246" fill="var(--text)" font-size="10" font-weight="700" text-anchor="start">fase acuosa</text>
    <text x="22" y="261" fill="var(--text-sub)" font-size="9" font-weight="500" text-anchor="start">fenolato</text>
    <line x1="166" y1="250" x2="210" y2="250" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#hl-flecha-ac)" />
    <text x="216" y="247" fill="var(--text-sub)" font-size="9" font-weight="500" text-anchor="start">acidificar →</text>
    <text x="216" y="259" fill="var(--accent)" font-size="9.5" font-weight="700" text-anchor="start">fenol</text>
  <line x1="150" y1="278" x2="150" y2="296" stroke="var(--text-sub)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#hl-flecha)" />
  <rect x="60" y="300" width="200" height="26" rx="7" fill="none" stroke="var(--text)" stroke-width="1.6" />
  <text x="160" y="317" fill="var(--text)" font-size="9.5" font-weight="600" text-anchor="middle">orgánico → evaporar → compuesto neutro</text>
  
</svg>