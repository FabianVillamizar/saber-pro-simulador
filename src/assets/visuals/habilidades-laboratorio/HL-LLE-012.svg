<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 214" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="hl-flecha" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="var(--text-sub)" />
    </marker>
    <marker id="hl-flecha-ac" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="var(--accent)" />
    </marker>
  </defs>

  <text x="220" y="20" fill="var(--text)" font-size="11" font-weight="700" text-anchor="middle">HSAB: el átomo donador y el metal coinciden en dureza</text>
  <text x="120" y="34" fill="var(--text-faint)" font-size="9" font-weight="500" text-anchor="middle">extractante</text>
  <text x="344" y="34" fill="var(--text-faint)" font-size="9" font-weight="500" text-anchor="middle">metal que extrae bien</text>
  
    <rect x="12" y="42" width="196" height="36" rx="6" fill="none" stroke="var(--accent)" stroke-width="1.6" />
    <text x="21" y="57" fill="var(--text)" font-size="10.5" font-weight="700" text-anchor="start">Fosfato de tributilo</text>
    <text x="21" y="71" fill="var(--text-sub)" font-size="9" font-weight="500" text-anchor="start">donador O fosforilo · duro</text>
    <line x1="216" y1="60" x2="252" y2="60" stroke="var(--accent)" stroke-width="2.2" marker-end="url(#hl-flecha)" />
    <circle cx="234" cy="60" r="3.5" fill="var(--accent)" />
    <rect x="260" y="42" width="168" height="36" rx="6" fill="none" stroke="var(--accent)" stroke-width="1.6" />
    <text x="269" y="57" fill="var(--text)" font-size="10.5" font-weight="700" text-anchor="start">UO₂²⁺ · Th⁴⁺ · Ln³⁺</text>
    <text x="269" y="71" fill="var(--text-sub)" font-size="9" font-weight="500" text-anchor="start">duros · baja polarizabilidad</text>
  
    <rect x="12" y="88" width="196" height="36" rx="6" fill="none" stroke="var(--warning)" stroke-width="1.6" />
    <text x="21" y="103" fill="var(--text)" font-size="10.5" font-weight="700" text-anchor="start">Ditizona</text>
    <text x="21" y="117" fill="var(--text-sub)" font-size="9" font-weight="500" text-anchor="start">donador N, S · blando</text>
    <line x1="216" y1="106" x2="252" y2="106" stroke="var(--warning)" stroke-width="2.2" marker-end="url(#hl-flecha)" />
    <circle cx="234" cy="106" r="3.5" fill="var(--warning)" />
    <rect x="260" y="88" width="168" height="36" rx="6" fill="none" stroke="var(--warning)" stroke-width="1.6" />
    <text x="269" y="103" fill="var(--text)" font-size="10.5" font-weight="700" text-anchor="start">Hg²⁺ · Ag⁺ · Pb²⁺</text>
    <text x="269" y="117" fill="var(--text-sub)" font-size="9" font-weight="500" text-anchor="start">blandos · muy polarizables</text>
  
    <rect x="12" y="134" width="196" height="36" rx="6" fill="none" stroke="var(--exito)" stroke-width="1.6" />
    <text x="21" y="149" fill="var(--text)" font-size="10.5" font-weight="700" text-anchor="start">Oximas (LIX)</text>
    <text x="21" y="163" fill="var(--text-sub)" font-size="9" font-weight="500" text-anchor="start">donador O, N · frontera</text>
    <line x1="216" y1="152" x2="252" y2="152" stroke="var(--exito)" stroke-width="2.2" marker-end="url(#hl-flecha)" />
    <circle cx="234" cy="152" r="3.5" fill="var(--exito)" />
    <rect x="260" y="134" width="168" height="36" rx="6" fill="none" stroke="var(--exito)" stroke-width="1.6" />
    <text x="269" y="149" fill="var(--text)" font-size="10.5" font-weight="700" text-anchor="start">Cu²⁺</text>
    <text x="269" y="163" fill="var(--text-sub)" font-size="9" font-weight="500" text-anchor="start">frontera duro–blando</text>
  <text x="220" y="188" fill="var(--text-faint)" font-size="9" font-weight="500" text-anchor="middle">Duro con duro, blando con blando: la selectividad se predice,</text>
  <text x="220" y="201" fill="var(--text-faint)" font-size="9" font-weight="500" text-anchor="middle">no se memoriza reactivo por reactivo.</text>
  
</svg>